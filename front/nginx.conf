# 바깥 프록시(HTTPS)가 보낸 프로토콜을 유지하고, 없으면 현재 연결 기준으로 한다.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 실제 방문자 IP: Cloudflare가 넣는 CF-Connecting-IP > 바깥 nginx가 넣는 X-Real-IP > 직전 연결 주소 순.
# 이 컨테이너는 127.0.0.1에만 열려 있어(compose.yaml) 이 헤더는 터널·호스트 nginx를 거친 값만 들어온다.
map $http_cf_connecting_ip $client_ip_a {
    default $http_cf_connecting_ip;
    ''      $http_x_real_ip;
}
map $client_ip_a $client_ip {
    default $client_ip_a;
    ''      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 정적 자산 캐시 (Vite 해시 파일명)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 백엔드 API 프록시 (compose의 back 서비스)
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream back:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
